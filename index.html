<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Andrew Gio Kang</title>
  <meta name="description" content="Andrew Gio Kang's personal website.">
  <meta name="theme-color" content="#0b3b4a">
  <link rel="preload" as="image" href="assets/scene1-plate.jpg">
  <link rel="preload" as="image" href="assets/reef-2.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" rel="stylesheet">
  <style>
    /* Palatino Medium, falling back through the common Palatino cuts */
    @font-face {
      font-family: "AGK Palatino";
      src: local("Palatino Medium"), local("Palatino-Medium"),
           local("Palatino nova Medium"), local("PalatinoNova-Medium"),
           local("Palatino LT Std Medium"), local("PalatinoLTStd-Medium"),
           local("Palatino Linotype"), local("PalatinoLinotype-Roman"),
           local("Palatino"), local("Palatino-Roman"), local("Book Antiqua");
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: "AGK Palatino";
      src: local("Palatino Medium Italic"), local("Palatino-MediumItalic"),
           local("Palatino nova Medium Italic"), local("PalatinoNova-MediumItalic"),
           local("Palatino LT Std Medium Italic"), local("PalatinoLTStd-MediumItalic"),
           local("Palatino Linotype Italic"), local("PalatinoLinotype-Italic"),
           local("Palatino Italic"), local("Palatino-Italic"), local("Book Antiqua Italic");
      font-weight: 500;
      font-style: italic;
    }

    :root {
      --sea: #0b3b4a;
      --paper: #fffcf3;
      --ink: #16343e;
      --coral: #ff6a4d;
      --pencil: #2b2d30;
      --hand: "Gaegu", "Bradley Hand", "Segoe Print", cursive;
      --serif: "AGK Palatino", "Palatino Linotype", Palatino, "Book Antiqua",
               "URW Palladio L", P052, Georgia, serif;
      --vh: 1vh;
      --spring: cubic-bezier(.34, 1.56, .64, 1);
    }
    @supports (height: 1svh) { :root { --vh: 1svh; } }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--sea);
      color: var(--ink);
      font-family: var(--serif);
      font-weight: 500;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    [hidden] { display: none !important; }

    /* ---------- Layers ---------- */
    .reef, .wipe, .bubbles, .menu, .hello { position: fixed; inset: 0; }
    .reef    { z-index: 0; overflow: hidden; }
    .wipe    { z-index: 1; width: 100%; height: 100%; pointer-events: none; opacity: 0; }
    .bubbles { z-index: 2; width: 100%; height: 100%; pointer-events: none; }
    .menu    { z-index: 3; }
    .hello   { z-index: 4; overflow: hidden; background: var(--sea); cursor: pointer; }

    .wipe.is-on { opacity: 1; }
    .wipe.is-fading { opacity: 0; transition: opacity .5s ease; }

    /* ---------- Scene 2: the reef ---------- */
    .reef img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 45%;
      scale: 1.14;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .is-diving .reef img,
    .is-menu .reef img {
      scale: 1;
      transition: scale 2.4s cubic-bezier(.2, .7, .2, 1);
    }
    @keyframes drift {
      from { translate: 0 0; }
      to   { translate: -1.2% -.8%; }
    }

    /* ---------- Scene 1: hello ---------- */
    /* 3:2 frame sized to cover the viewport, so overlays line up with the photo */
    .frame {
      position: absolute;
      width: max(100vw, calc(150 * var(--vh)));
      aspect-ratio: 3 / 2;
      left: calc(50vw - max(50vw, calc(75 * var(--vh))));
      top: calc(50 * var(--vh) - max(33.3333vw, calc(50 * var(--vh))));
      transform-origin: 47% 31%;
      opacity: 0;
    }
    .is-ready .frame {
      animation: fade-in .9s ease forwards, push-in 14s cubic-bezier(.25, .6, .3, 1) forwards,
                 sway 6s ease-in-out infinite alternate;
    }
    @keyframes fade-in { to { opacity: 1; } }
    @keyframes push-in { from { scale: 1; } to { scale: 1.09; } }
    @keyframes sway { from { translate: 0 -.25%; } to { translate: 0 .25%; } }

    .plate { display: block; width: 100%; height: 100%; }

    .hand { position: absolute; display: block; }
    .hand--l { left: 43.4848%; top: 30.9091%; width: 3.4848%; height: 5.2273%; transform-origin: 42.61% 92.39%; }
    .hand--r { left: 49.3939%; top: 27.5%;    width: 3.4091%; height: 4.6591%; transform-origin: 75.56% 82.93%; }
    .is-ready .hand--r { animation: wave-r 2.3s ease-in-out .7s infinite; }
    .is-ready .hand--l { animation: wave-l 2.3s ease-in-out .85s infinite; }
    @keyframes wave-r {
      0%, 66%, 100% { rotate: 0deg; }
      11% { rotate: -15deg; }  24% { rotate: 13deg; }
      37% { rotate: -13deg; }  50% { rotate: 11deg; }
    }
    @keyframes wave-l {
      0%, 66%, 100% { rotate: 0deg; }
      11% { rotate: 10deg; }   24% { rotate: -9deg; }
      37% { rotate: 9deg; }    50% { rotate: -7deg; }
    }

    /* little breath bubbles drifting up from the snorkel */
    .puffs { position: absolute; left: 45.6%; top: 3%; width: 2.4%; height: 22%; pointer-events: none; }
    .puffs i {
      position: absolute;
      top: 100%;
      left: var(--x);
      width: var(--s);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .75);
      background: radial-gradient(circle at 32% 30%, rgba(255, 255, 255, .9) 0 18%, rgba(255, 255, 255, .12) 22% 100%);
      opacity: 0;
    }
    .is-ready .puffs i { animation: puff 3.4s ease-in var(--d) infinite; }
    @keyframes puff {
      0%   { top: 100%; opacity: 0; translate: 0 0; }
      12%  { opacity: .9; }
      50%  { translate: 4px 0; }
      85%  { opacity: .8; }
      100% { top: 0%; opacity: 0; translate: -3px 0; }
    }

    /* "hi!" speech bubble, anchored above the snorkeler's head */
    .hi-anchor { position: absolute; left: 46.2%; top: 22.5%; width: 0; height: 0; }
    .hi {
      position: absolute;
      left: -18px;
      bottom: 12px;
      padding: .14em .62em .24em;
      background: var(--paper);
      color: var(--ink);
      border-radius: 999px;
      font-style: italic;
      font-size: clamp(24px, 2.8vw, 40px);
      line-height: 1;
      white-space: nowrap;
      transform-origin: 18px 100%;
      filter: drop-shadow(0 6px 12px rgba(0, 30, 45, .3));
      scale: 0;
    }
    .hi::after {
      content: "";
      position: absolute;
      left: 12px;
      bottom: -6px;
      width: 14px;
      height: 14px;
      background: inherit;
      border-radius: 0 0 4px 0;
      rotate: 45deg;
    }
    .is-ready .hi { animation: pop-in .55s var(--spring) .95s forwards, nod 1.15s ease-in-out 1.6s infinite; }
    @keyframes pop-in { from { scale: 0; } to { scale: 1; } }
    @keyframes nod { 0%, 100% { translate: 0 0; rotate: 0deg; } 50% { translate: 0 -4px; rotate: -4deg; } }

    /* game dialog box */
    .dialog {
      position: absolute;
      left: 50%;
      bottom: max(56px, calc(9 * var(--vh)), calc(env(safe-area-inset-bottom) + 24px));
      width: min(540px, calc(100% - 32px));
      translate: -50% 24px;
      scale: .94;
      opacity: 0;
      margin: 0;
      padding: 22px 52px 24px 28px;
      background: var(--paper);
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(0, 25, 40, .35);
      outline: 2px solid rgba(22, 52, 62, .12);
      outline-offset: -8px;
      font-size: clamp(19px, 2.2vw, 24px);
      line-height: 1.35;
      min-height: calc(1.35em + 46px);
      transition: opacity .3s ease, translate .5s var(--spring), scale .5s var(--spring);
    }
    .dialog.is-open { opacity: 1; translate: -50% 0; scale: 1; }
    .dialog__next {
      position: absolute;
      right: 22px;
      bottom: 18px;
      width: 16px;
      height: 12px;
      color: var(--coral);
      opacity: 0;
      transition: opacity .2s ease;
    }
    .dialog.is-done .dialog__next { opacity: 1; animation: nudge .9s ease-in-out infinite; }
    @keyframes nudge { 50% { translate: 0 4px; } }

    .hello.is-leaving .hi,
    .hello.is-leaving .dialog { opacity: 0; transition: opacity .18s ease; animation-play-state: paused; }

    /* ---------- Sticker menu ---------- */
    .menu {
      --cell: min(21vw, calc(30 * var(--vh)), 260px);
      display: grid;
      place-items: center;
      padding-top: clamp(48px, calc(8 * var(--vh)), 96px);
      pointer-events: none;
    }
    .is-menu .menu { pointer-events: auto; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, var(--cell));
      column-gap: clamp(14px, 5vw, 84px);
      row-gap: clamp(10px, calc(4.5 * var(--vh)), 48px);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .slot {
      display: block;
      color: inherit;
      text-decoration: none;
      outline: none;
      opacity: 0;
      scale: .2;
    }
    .menu.is-in .slot { animation: sticker-pop .75s var(--spring) calc(var(--i) * 120ms) both; }
    @keyframes sticker-pop {
      0%   { opacity: 0; scale: .2; translate: 0 60px; }
      55%  { opacity: 1; scale: 1.12; translate: 0 -8px; }
      78%  { scale: .96; translate: 0 2px; }
      100% { opacity: 1; scale: 1; translate: 0 0; }
    }

    .bob {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: bob var(--dur) ease-in-out var(--delay) infinite;
    }
    @keyframes bob {
      0%, 100% { translate: 0 0;      rotate: 0deg; }
      25%      { translate: 3px -6px; rotate: 1deg; }
      50%      { translate: 0 -11px;  rotate: 0deg; }
      75%      { translate: -3px -5px; rotate: -1deg; }
    }

    .sticker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--cell);
      height: var(--cell);
      rotate: var(--tilt);
      transition: scale .45s var(--spring), rotate .45s var(--spring);
    }
    .sticker img {
      display: block;
      max-width: calc(100% * var(--size, 1));
      max-height: calc(100% * var(--size, 1));
      filter: drop-shadow(0 10px 12px rgba(0, 25, 40, .32)) drop-shadow(0 2px 2px rgba(0, 25, 40, .18));
      transition: filter .3s ease;
      -webkit-user-drag: none;
      user-select: none;
    }

    .tag {
      margin-top: -4px;
      padding: .3em .78em .38em;
      background: var(--paper);
      color: var(--ink);
      border-radius: 7px 4px 8px 5px;
      font-size: clamp(14px, 1.45vw, 19px);
      line-height: 1;
      white-space: nowrap;
      rotate: var(--tag);
      box-shadow: 0 4px 10px rgba(0, 25, 40, .28);
      transition: background-color .2s ease, color .2s ease, scale .35s var(--spring);
    }

    .slot:hover .sticker,
    .slot:focus-visible .sticker { scale: 1.1; rotate: 0deg; }
    .slot:hover .sticker img,
    .slot:focus-visible .sticker img { filter: drop-shadow(0 22px 20px rgba(0, 25, 40, .38)) drop-shadow(0 2px 2px rgba(0, 25, 40, .15)); }
    .slot:hover .tag,
    .slot:focus-visible .tag { background: var(--coral); color: #fff; scale: 1.06; }
    .slot:active .sticker { scale: .95; transition-duration: .12s; }
    .slot.is-picked .sticker { animation: picked .45s var(--spring); }
    @keyframes picked {
      0%   { scale: 1.1; rotate: 0deg; }
      35%  { scale: .86; rotate: -6deg; }
      100% { scale: 1.18; rotate: 4deg; }
    }

    /* ---------- Journal-paper title ---------- */
    .title {
      position: absolute;
      z-index: 2;
      left: clamp(10px, 2.4vw, 40px);
      top: clamp(14px, calc(3 * var(--vh)), 38px);
      margin: 0;
      font-size: clamp(26px, 3.1vw, 44px);
      font-weight: 500;
      font-style: italic;
      line-height: 1;
      white-space: nowrap;
      rotate: -9deg;
      opacity: 0;
      pointer-events: none;
    }
    .menu.is-in .title { animation: paper-in .8s var(--spring) both; }
    @keyframes paper-in {
      from { opacity: 0; translate: -40px -50px; scale: .7; }
      to   { opacity: 1; translate: 0 0; scale: 1; }
    }
    .title__float {
      display: block;
      filter: drop-shadow(0 10px 14px rgba(0, 25, 40, .3)) drop-shadow(0 1px 1px rgba(0, 25, 40, .2));
      animation: bob 6.5s ease-in-out -1s infinite;
    }
    /* lined notebook page: blue rules, red margin, spiral holes on top, torn bottom edge */
    .title__paper {
      display: block;
      padding: .9em .8em .62em 1.5em;
      color: #1d2f5c;
      background-color: #fffdf5;
      background-image:
        linear-gradient(90deg, transparent 1.05em, rgba(226, 92, 92, .65) 1.05em, rgba(226, 92, 92, .65) calc(1.05em + 1.5px), transparent calc(1.05em + 1.5px)),
        repeating-linear-gradient(180deg, transparent 0 calc(.55em - 1px), rgba(84, 140, 205, .4) calc(.55em - 1px) .55em);
      background-position: 0 0, 0 .52em;
      -webkit-mask: radial-gradient(circle .16em at 50% .4em, transparent 95%, #000 100%) 0 0 / .6em 100% repeat-x;
      mask: radial-gradient(circle .16em at 50% .4em, transparent 95%, #000 100%) 0 0 / .6em 100% repeat-x;
      clip-path: polygon(0 0, 100% 0, 100% 91%, 97% 95%, 93% 92%, 89% 97%, 85% 93%, 80% 97%, 76% 92%, 71% 96%,
                         66% 93%, 61% 98%, 56% 93%, 51% 96%, 46% 92%, 41% 97%, 36% 93%, 31% 96%, 26% 92%,
                         21% 97%, 16% 93%, 11% 96%, 6% 92%, 2% 96%, 0 93%);
    }

    /* ---------- Pencil note on the About Me sticker ---------- */
    .li--about { position: relative; }
    .note {
      position: absolute;
      inset: 0;
      z-index: 2;
      color: var(--pencil);
      pointer-events: none;
    }
    .note__arrow {
      position: absolute;
      left: calc(var(--cell) * .82);
      top: calc(var(--cell) * .6);
      width: calc(var(--cell) * .22);
      height: calc(var(--cell) * .5);
      overflow: visible;
      fill: none;
      stroke: currentColor;
      stroke-width: 3px;
      filter: drop-shadow(0 0 1.5px rgba(255, 255, 255, .95)) drop-shadow(0 0 5px rgba(255, 255, 255, .6));
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .note__arrow path { stroke-dasharray: 1; stroke-dashoffset: 1; vector-effect: non-scaling-stroke; }
    .menu.is-in .note__shaft { animation: draw .45s ease-out 1.85s forwards; }
    .menu.is-in .note__head  { animation: draw .18s ease-out 2.3s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .note__text {
      position: absolute;
      left: calc(var(--cell) * 1.0);
      top: calc(var(--cell) * 1.06);
      font-family: var(--hand);
      font-weight: 700;
      font-size: max(19px, calc(var(--cell) * .145));
      line-height: 1;
      white-space: nowrap;
      rotate: 3deg;
      text-shadow: 0 0 1px rgba(255, 255, 255, .9), 0 0 4px rgba(255, 255, 255, .85), 0 0 12px rgba(255, 255, 255, .5);
      clip-path: inset(-30% 100% -30% 0);
    }
    .menu.is-in .note__text { animation: write .75s linear 1.1s forwards; }
    @keyframes write { to { clip-path: inset(-30% -5% -30% -5%); } }

    /* ---------- Sound toggle ---------- */
    .sound {
      position: fixed;
      z-index: 10;
      right: max(16px, env(safe-area-inset-right));
      top: max(16px, env(safe-area-inset-top));
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 252, 243, .88);
      color: var(--ink);
      box-shadow: 0 4px 12px rgba(0, 25, 40, .25);
      cursor: pointer;
      transition: scale .3s var(--spring);
    }
    .sound:hover { scale: 1.08; }
    .sound:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
    .sound svg { width: 20px; height: 20px; }
    .sound .waves { transition: opacity .2s ease; }
    .sound[aria-pressed="false"] .waves { opacity: 0; }
    .sound .mute { opacity: 0; transition: opacity .2s ease; }
    .sound[aria-pressed="false"] .mute { opacity: 1; }

    /* ---------- Small screens: 2 x 3 ---------- */
    @media (max-width: 640px) {
      .menu { --cell: min(42vw, calc(21 * var(--vh)), 200px); padding-top: 88px; }
      .title { font-size: 24px; }
      .li--about { margin-bottom: 30px; }
      .note__arrow { top: calc(var(--cell) * .72); }
      .note__text { left: auto; right: calc(var(--cell) * .02); top: calc(var(--cell) + 28px); rotate: -3deg; }
      .grid { grid-template-columns: repeat(2, var(--cell)); column-gap: 28px; }
      .dialog { padding: 18px 46px 20px 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .is-ready .frame { animation: fade-in .4s ease forwards; }
      .is-ready .hand--r, .is-ready .hand--l, .is-ready .puffs i { animation: none; }
      .is-ready .hi { animation: pop-in .01s linear .4s forwards; }
      .reef img { animation: none; scale: 1; }
      .menu.is-in .slot { animation: fade-in .4s ease both; scale: 1; }
      .bob, .title__float { animation: none; }
      .menu.is-in .title { animation: fade-in .4s ease both; scale: 1; translate: 0 0; }
      .menu.is-in .note__text { animation: none; clip-path: none; }
      .menu.is-in .note__arrow path { animation: none; stroke-dashoffset: 0; }
      .dialog.is-done .dialog__next { animation: none; }
    }
  </style>
  <noscript><style>.hello { display: none; } .slot, .title { opacity: 1; scale: 1; } .menu { pointer-events: auto; } .reef img { scale: 1; } .note__text { clip-path: none; } .note__arrow path { stroke-dashoffset: 0; }</style></noscript>
</head>
<body>
  <div class="reef" aria-hidden="true">
    <img src="assets/reef-2.webp" alt="">
  </div>

  <canvas class="wipe" aria-hidden="true"></canvas>
  <canvas class="bubbles" aria-hidden="true"></canvas>

  <main class="menu" id="menu">
    <h1 class="title"><span class="title__float"><span class="title__paper">Andrew&rsquo;s Reef</span></span></h1>
    <nav aria-label="Sections">
      <ul class="grid">
        <li><a class="slot" href="film.html" style="--i:0; --tilt:-5deg; --tag:-3deg; --dur:3.8s; --delay:-.6s">
          <span class="bob"><span class="sticker"><img src="assets/sticker-camera.png" alt=""></span><span class="tag">Film &amp; Media</span></span>
        </a></li>
        <li class="li--about"><a class="slot" href="about.html" style="--i:1; --tilt:3deg; --tag:3deg; --dur:4.1s; --delay:-3s">
          <span class="bob"><span class="sticker"><img src="assets/sticker-face.png" alt=""></span><span class="tag">About Me!</span></span>
        </a>
          <span class="note" aria-hidden="true">
            <svg class="note__arrow" viewBox="0 0 44 100">
              <path class="note__shaft" pathLength="1" d="M38 96 C 41 66, 31 26, 8 6"/>
              <path class="note__head" pathLength="1" d="M12 17.3 L 8 6 L 19.8 8.2"/>
            </svg>
            <span class="note__text">this me btw...</span>
          </span>
        </li>
        <li><a class="slot" href="blog.html" style="--i:2; --tilt:4deg; --tag:2deg; --dur:4.4s; --delay:-2.1s; --size:.95">
          <span class="bob"><span class="sticker"><img src="assets/sticker-journal.png" alt=""></span><span class="tag">Blog</span></span>
        </a></li>
        <li><a class="slot" href="research.html" style="--i:3; --tilt:-2deg; --tag:-2deg; --dur:3.5s; --delay:-1.3s">
          <span class="bob"><span class="sticker"><img src="assets/sticker-microscope.png" alt=""></span><span class="tag">Research</span></span>
        </a></li>
        <li><a class="slot" href="projects.html" style="--i:4; --tilt:-4deg; --tag:-1deg; --dur:3.9s; --delay:-.2s">
          <span class="bob"><span class="sticker"><img src="assets/sticker-mask.png" alt=""></span><span class="tag">Projects</span></span>
        </a></li>
        <li><a class="slot" href="venture.html" style="--i:5; --tilt:5deg; --tag:2deg; --dur:4.6s; --delay:-1.7s; --size:.95">
          <span class="bob"><span class="sticker"><img src="assets/sticker-fins.png" alt=""></span><span class="tag">Venture</span></span>
        </a></li>
      </ul>
    </nav>
  </main>


  <section class="hello" id="hello" aria-label="Welcome">
    <div class="frame">
      <img class="plate" src="assets/scene1-plate.jpg" alt="Andrew snorkeling over a staghorn coral reef, waving hello">
      <img class="hand hand--l" src="assets/hand-l.png" alt="" data-origin="42.61,92.39">
      <img class="hand hand--r" src="assets/hand-r.png" alt="" data-origin="75.56,82.93">
      <div class="puffs" aria-hidden="true">
        <i style="--x:20%; --s:5px; --d:.2s"></i>
        <i style="--x:55%; --s:3px; --d:1.1s"></i>
        <i style="--x:35%; --s:7px; --d:1.9s"></i>
        <i style="--x:65%; --s:4px; --d:2.6s"></i>
      </div>
      <div class="hi-anchor"><div class="hi" aria-hidden="true">hi!</div></div>
    </div>
    <p class="dialog" aria-live="polite">
      <span class="dialog__text"></span>
      <svg class="dialog__next" viewBox="0 0 16 12" aria-hidden="true"><path d="M1.5 1.5h13L8 10.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </p>
  </section>

  <button class="sound" type="button" aria-pressed="true" aria-label="Sound">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>
      <g class="waves"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></g>
      <g class="mute"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g>
    </svg>
  </button>

  <script>
  (function () {
    var MESSAGE = 'welcome to my personal website';
    var TAU = Math.PI * 2;
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var body = document.body;
    var hello = document.getElementById('hello');
    var frame = hello.querySelector('.frame');
    var plate = hello.querySelector('.plate');
    var hands = Array.prototype.slice.call(hello.querySelectorAll('.hand'));
    var dialog = hello.querySelector('.dialog');
    var textEl = hello.querySelector('.dialog__text');
    var menu = document.getElementById('menu');
    var slots = Array.prototype.slice.call(menu.querySelectorAll('.slot'));
    var wipe = document.querySelector('.wipe');
    var fx = document.querySelector('.bubbles');
    var fxc = fx.getContext('2d');
    var state = 'loading';
    var autoTimer, typeTimer, introTimer, lastInputWasKey = false;

    /* ---------- Sound: tiny synthesized blips, unlocked on first gesture ---------- */
    var Sound = (function () {
      var ctx = null, on = true;
      try { on = localStorage.getItem('agk-sound') !== 'off'; } catch (e) {}
      function unlock() {
        if (!ctx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          ctx = new AC();
        }
        if (ctx.state === 'suspended') ctx.resume();
      }
      function live() { return on && ctx && ctx.state === 'running'; }
      function tone(o) {
        if (!live()) return;
        var t = ctx.currentTime + (o.delay || 0), dur = o.dur || .08;
        var osc = ctx.createOscillator(), g = ctx.createGain();
        osc.type = o.type || 'sine';
        osc.frequency.setValueAtTime(o.f0, t);
        osc.frequency.exponentialRampToValueAtTime(o.f1 || o.f0, t + dur);
        g.gain.setValueAtTime(.0001, t);
        g.gain.exponentialRampToValueAtTime(o.gain || .08, t + .008);
        g.gain.exponentialRampToValueAtTime(.0001, t + dur);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(t); osc.stop(t + dur + .03);
      }
      return {
        unlock: unlock,
        get on() { return on; },
        set on(v) { on = v; try { localStorage.setItem('agk-sound', v ? 'on' : 'off'); } catch (e) {} },
        tick: function () { tone({ type: 'triangle', f0: 1350 + Math.random() * 250, dur: .03, gain: .02 }); },
        blip: function () { tone({ f0: 900, f1: 1300, dur: .06, gain: .045 }); },
        pop: function (delay) { tone({ f0: 320, f1: 820, dur: .09, gain: .1, delay: delay }); },
        scribble: function (delay) {
          if (!live()) return;
          var t = ctx.currentTime + (delay || 0), len = .7, sr = ctx.sampleRate;
          var buf = ctx.createBuffer(1, sr * len, sr), d = buf.getChannelData(0);
          for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (.35 + .65 * Math.abs(Math.sin(i / sr * Math.PI * 9)));
          var src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
          src.buffer = buf; bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = .8;
          g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.045, t + .05);
          g.gain.setValueAtTime(.045, t + len - .1); g.gain.exponentialRampToValueAtTime(.0001, t + len);
          src.connect(bp); bp.connect(g); g.connect(ctx.destination); src.start(t); src.stop(t + len);
        },
        select: function () {
          tone({ type: 'triangle', f0: 660, dur: .09, gain: .07 });
          tone({ type: 'triangle', f0: 990, dur: .14, gain: .07, delay: .08 });
        },
        bubbles: function () {
          if (!live()) return;
          var t = ctx.currentTime, len = 1.6;
          var buf = ctx.createBuffer(1, ctx.sampleRate * len, ctx.sampleRate), d = buf.getChannelData(0);
          for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          var src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
          src.buffer = buf; bp.type = 'bandpass'; bp.Q.value = 1.4;
          bp.frequency.setValueAtTime(350, t); bp.frequency.exponentialRampToValueAtTime(2200, t + len);
          g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.09, t + .25);
          g.gain.exponentialRampToValueAtTime(.0001, t + len);
          src.connect(bp); bp.connect(g); g.connect(ctx.destination); src.start(t); src.stop(t + len);
          for (var k = 0; k < 22; k++) {
            var f = 500 + Math.random() * 1100;
            tone({ f0: f, f1: f * 1.8, dur: .05, gain: .025 + Math.random() * .025, delay: Math.random() * 1.3 });
          }
        }
      };
    })();

    var soundBtn = document.querySelector('.sound');
    soundBtn.setAttribute('aria-pressed', String(Sound.on));
    soundBtn.addEventListener('click', function () {
      Sound.on = !Sound.on;
      soundBtn.setAttribute('aria-pressed', String(Sound.on));
      if (Sound.on) { Sound.unlock(); Sound.blip(); }
    });
    ['pointerdown', 'keydown'].forEach(function (ev) {
      window.addEventListener(ev, function (e) { lastInputWasKey = ev === 'keydown'; Sound.unlock(); }, true);
    });

    /* ---------- Bubbles canvas (transition burst + ambient) ---------- */
    var bubbles = [], rafOn = false, last = 0, ambient = false, nextAmbient = 0, wipeCtx = null;
    function dpr() { return Math.min(window.devicePixelRatio || 1, 2); }
    function sizeCanvas(c, ctx) {
      var r = dpr();
      c.width = Math.round(innerWidth * r); c.height = Math.round(innerHeight * r);
      ctx.setTransform(r, 0, 0, r, 0, 0);
    }
    sizeCanvas(fx, fxc);
    window.addEventListener('resize', function () { sizeCanvas(fx, fxc); });

    function easeOutBack(x) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
    function scaleFactor() { return Math.max(.55, Math.min(1.4, Math.sqrt(innerWidth * innerHeight) / 1000)); }

    function burst(now) {
      var W = innerWidth, H = innerHeight, s = scaleFactor();
      var n = Math.round(Math.max(90, Math.min(240, W * H / 7000)));
      for (var i = 0; i < n; i++) {
        var delay = Math.pow(Math.random(), .9) * .85, prog = delay / .85;
        bubbles.push({
          x: Math.random() * W,
          y: H * (1.08 - prog * .95) + (Math.random() - .5) * H * .3,
          R: (14 + Math.pow(Math.random(), 2.2) * 95) * s,
          born: now + delay * 1000,
          vy: (140 + Math.random() * 260) * s,
          wob: 4 + Math.random() * 12, ph: Math.random() * TAU, fq: 2 + Math.random() * 3,
          life: 2.4 + Math.random() * .6, erase: true
        });
      }
    }
    function ambientBubble(now) {
      var s = scaleFactor(), H = innerHeight;
      var vy = (35 + Math.random() * 55) * s;
      bubbles.push({
        x: Math.random() * innerWidth, y: H + 12, R: (2 + Math.random() * 6) * s, born: now,
        vy: vy, wob: 3 + Math.random() * 6, ph: Math.random() * TAU, fq: 1 + Math.random() * 2,
        life: (H + 40) / vy + 1, erase: false, soft: true
      });
    }

    function drawBubble(c, x, y, r, a) {
      if (r < .5 || a <= 0) return;
      c.beginPath(); c.arc(x, y, r, 0, TAU);
      if (r > 6) {
        var g = c.createRadialGradient(x - r * .3, y - r * .35, r * .1, x, y, r);
        g.addColorStop(0, 'rgba(255,255,255,' + (.1 * a) + ')');
        g.addColorStop(.75, 'rgba(255,255,255,' + (.05 * a) + ')');
        g.addColorStop(1, 'rgba(255,255,255,' + (.32 * a) + ')');
        c.fillStyle = g; c.fill();
      }
      c.lineWidth = Math.max(1, r * .05);
      c.strokeStyle = 'rgba(255,255,255,' + (.72 * a) + ')';
      c.stroke();
      c.fillStyle = 'rgba(255,255,255,' + (.9 * a) + ')';
      c.beginPath(); c.ellipse(x - r * .38, y - r * .38, r * .2, r * .11, -Math.PI / 4, 0, TAU); c.fill();
      if (r > 10) {
        c.strokeStyle = 'rgba(255,255,255,' + (.38 * a) + ')';
        c.lineWidth = Math.max(1, r * .04);
        c.beginPath(); c.arc(x, y, r * .72, .15 * Math.PI, .4 * Math.PI); c.stroke();
      }
    }

    function frameLoop(now) {
      var dt = Math.min(.05, (now - last) / 1000); last = now;
      fxc.clearRect(0, 0, innerWidth, innerHeight);
      if (ambient && now > nextAmbient) { ambientBubble(now); nextAmbient = now + 280 + Math.random() * 520; }
      for (var i = 0; i < bubbles.length; i++) {
        var b = bubbles[i], age = (now - b.born) / 1000;
        if (age < 0) continue;
        b.y -= b.vy * dt; b.vy += (b.soft ? 4 : 70) * dt;
        var x = b.x + Math.sin(age * b.fq + b.ph) * b.wob;
        var r = b.R * (b.soft ? 1 : easeOutBack(Math.min(1, age / .35)));
        if (b.erase && wipeCtx) { wipeCtx.beginPath(); wipeCtx.arc(x, b.y, r, 0, TAU); wipeCtx.fill(); }
        var a = Math.min(1, age / .1) * Math.max(0, Math.min(1, (b.life - age) / .4)) * (b.soft ? .6 : 1);
        drawBubble(fxc, x, b.y, r, a);
        if (age > b.life || b.y + r < -10) b.dead = true;
      }
      bubbles = bubbles.filter(function (b) { return !b.dead; });
      if (bubbles.length || ambient) requestAnimationFrame(frameLoop); else rafOn = false;
    }
    function runLoop() { if (!rafOn) { rafOn = true; last = performance.now(); requestAnimationFrame(frameLoop); } }

    /* ---------- Intro ---------- */
    function typeMessage() {
      state = 'typing';
      dialog.classList.add('is-open');
      var i = 0;
      (function step() {
        i++;
        textEl.textContent = MESSAGE.slice(0, i);
        if (i % 2 && MESSAGE[i - 1] !== ' ') Sound.tick();
        if (i < MESSAGE.length) typeTimer = setTimeout(step, reduce ? 0 : 38);
        else finishTyping();
      })();
    }
    function finishTyping() {
      clearTimeout(typeTimer);
      textEl.textContent = MESSAGE;
      dialog.classList.add('is-done');
      state = 'ready';
      autoTimer = setTimeout(dive, 3800);
    }
    function advance() {
      if (state === 'intro') { clearTimeout(introTimer); typeMessage(); }
      else if (state === 'typing') finishTyping();
      else if (state === 'ready') dive();
    }

    // paint the current hello frame (photo + hands at their live angles) onto the wipe canvas
    function snapshot() {
      wipeCtx = wipe.getContext('2d');
      sizeCanvas(wipe, wipeCtx);
      var r = frame.getBoundingClientRect(), k = r.width / frame.offsetWidth;
      wipeCtx.fillStyle = '#0b3b4a';
      wipeCtx.fillRect(0, 0, innerWidth, innerHeight);
      wipeCtx.drawImage(plate, r.left, r.top, r.width, r.height);
      hands.forEach(function (h) {
        var w = h.offsetWidth * k, hh = h.offsetHeight * k;
        var x = r.left + h.offsetLeft * k, y = r.top + h.offsetTop * k;
        var o = h.getAttribute('data-origin').split(',').map(Number);
        var ox = w * o[0] / 100, oy = hh * o[1] / 100;
        var ang = parseFloat(getComputedStyle(h).rotate) || 0;
        wipeCtx.save();
        wipeCtx.translate(x + ox, y + oy);
        wipeCtx.rotate(ang * Math.PI / 180);
        wipeCtx.drawImage(h, -ox, -oy, w, hh);
        wipeCtx.restore();
      });
      wipeCtx.globalCompositeOperation = 'destination-out';
      wipeCtx.fillStyle = '#000';
      wipe.classList.add('is-on');
    }

    function popStickers() {
      menu.classList.add('is-in');
      slots.forEach(function (s, i) { Sound.pop(i * .12 + .3); });
      Sound.scribble(1.1);
    }

    function enterMenu() {
      state = 'menu';
      body.classList.add('is-menu');
      ambient = true; runLoop();
      if (lastInputWasKey) slots[0].focus();
    }

    function dive() {
      if (state !== 'ready' && state !== 'typing') return;
      state = 'diving';
      clearTimeout(autoTimer); clearTimeout(typeTimer);
      hello.classList.add('is-leaving');
      if (reduce) {
        hello.style.transition = 'opacity .5s ease';
        hello.style.opacity = '0';
        body.classList.add('is-diving');
        setTimeout(function () { hello.hidden = true; popStickers(); enterMenu(); }, 500);
        return;
      }
      Sound.bubbles();
      setTimeout(function () {
        snapshot();
        hello.hidden = true;
        body.classList.add('is-diving');
        var now = performance.now();
        burst(now); runLoop();
        setTimeout(popStickers, 1100);
        setTimeout(function () { wipe.classList.add('is-fading'); }, 1500);
        setTimeout(function () { wipe.hidden = true; wipeCtx = null; enterMenu(); }, 2100);
      }, 180);
    }

    hello.addEventListener('click', advance);

    /* ---------- Keyboard: A/Enter to continue, arrows to move between stickers ---------- */
    document.addEventListener('keydown', function (e) {
      if (state === 'intro' || state === 'typing' || state === 'ready') {
        if (e.target.closest && e.target.closest('button')) return;
        if (['Enter', ' ', 'ArrowRight', 'a', 'A', 'x', 'X'].indexOf(e.key) > -1) { e.preventDefault(); advance(); }
        return;
      }
      if (state !== 'menu') return;
      var keys = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: 'up', ArrowDown: 'down' };
      if (!(e.key in keys)) return;
      e.preventDefault();
      var cols = getComputedStyle(menu.querySelector('.grid')).gridTemplateColumns.split(' ').length;
      var idx = slots.indexOf(document.activeElement);
      if (idx < 0) { slots[0].focus(); return; }
      var d = keys[e.key], next = d === 'up' ? idx - cols : d === 'down' ? idx + cols : idx + d;
      if (next >= 0 && next < slots.length) slots[next].focus();
    });

    /* ---------- Stickers ---------- */
    slots.forEach(function (s) {
      s.addEventListener('pointerenter', function () { if (state === 'menu') Sound.blip(); });
      s.addEventListener('focus', function () { if (state === 'menu' && lastInputWasKey) Sound.blip(); });
      s.addEventListener('click', function (e) {
        if (reduce || e.metaKey || e.ctrlKey || e.shiftKey) return;
        e.preventDefault();
        if (s.classList.contains('is-picked')) return;
        s.classList.add('is-picked');
        Sound.select();
        setTimeout(function () { window.location.href = s.href; }, 420);
      });
    });
    window.addEventListener('pageshow', function () {
      slots.forEach(function (s) { s.classList.remove('is-picked'); });
    });

    /* ---------- Start once the hello layers have decoded ---------- */
    var layers = [plate].concat(hands);
    var decoded = Promise.all(layers.map(function (img) { return img.decode ? img.decode().catch(function () {}) : null; }));
    // never let a slow decode stall the intro
    Promise.race([decoded, new Promise(function (res) { setTimeout(res, 2500); })])
      .then(function () {
        if (location.hash === '#menu') {
          hello.hidden = true; wipe.hidden = true;
          state = 'diving';
          body.classList.add('is-diving');
          popStickers(); enterMenu();
          return;
        }
        body.classList.add('is-ready');
        state = 'intro';
        introTimer = setTimeout(typeMessage, reduce ? 300 : 1500);
      });
  })();
  </script>
</body>
</html>
